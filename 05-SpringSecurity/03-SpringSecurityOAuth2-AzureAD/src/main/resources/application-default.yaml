server:
  port: 8083
spring:
  application:
    name: SpringSecurityOAuth2-AzureAD

  security:
    oauth2:
      client:
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/your-tenant-id-comes-here/v2.0
        registration:
          azure-dev:
            provider: azure
            client-id: XXXXXXXXXXXXXXXXXX
            client-secret: XXXXXXXXXXXXXX
            scope:
              - openid
              - email
              - profile



logging:
  level:
    org.springframework.security.web: DEBUG

