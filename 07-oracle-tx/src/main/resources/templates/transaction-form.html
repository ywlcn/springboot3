<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oracle 23ai 跨 Schema 事务检证</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1, h2 { color: #333; }
        .status-box { border: 1px solid #ccc; padding: 15px; background-color: #f9f9f9; margin-bottom: 20px; }
        .message-success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .message-error { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 80px; font-weight: bold; }
        input[type="text"], input[type="number"] { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-commit { background-color: #007bff; color: white; }
        .btn-rollback { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>跨 Schema 事务一致性验证 (Oracle 23ai)</h1>
    <p>该程序使用 Spring Boot + MyBatis，通过一个连接，在同一个事务中操作 **SCHEMA_A** 和 **SCHEMA_B** 的表。</p>

    <div th:if="${successMessage}" class="message-success">
        <strong>成功操作:</strong> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="message-error">
        <strong>事务回滚/错误:</strong> <span th:text="${errorMessage}"></span>
    </div>

    <h2>当前数据状态</h2>
    <div class="status-box">
        <strong th:text="${currentStatus}">SCHEMA_A = ACTIVE, SCHEMA_B = ACTIVE</strong>
    </div>


    <h2>执行新的事务操作</h2>
    <form th:action="@{/perform}" method="post">
        <div class="form-group">
            <label for="id">记录 ID:</label>
            <input type="number" id="id" name="id" th:value="${id}" readonly="readonly">
        </div>
        <div class="form-group">
            <label for="status">新状态值:</label>
            <input type="text" id="status" name="status" th:value="${status}" required>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" name="action" value="COMMIT" class="btn-commit">
                执行事务并提交 (COMMIT)
            </button>

            <button type="submit" name="action" value="ROLLBACK" class="btn-rollback">
                执行事务并触发回滚 (ROLLBACK)
            </button>
        </div>
        <p style="margin-top: 15px; color: #666;">**注意:** 在 Rollback 模式下，系统会在更新操作后故意抛出异常。如果两个表的 Status 值保持不变，则证明一致性有效。</p>
    </form>
</div>

</body>
</html>
